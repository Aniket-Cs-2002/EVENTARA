<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Error | Eventara</title>

    <link rel="stylesheet" href="./src/output.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body class="min-h-screen bg-[#F6F6F6] flex items-center justify-center px-4">

    <div class="w-full max-w-[461px] bg-white rounded-[32px] shadow-[0_20px_50px_rgba(15,23,42,0.08)] px-[60px] py-[70px]">

        <!-- Error Icon -->

        <div class="flex justify-center">

            <div
                class="w-[100px] h-[100px] rounded-full bg-[#CB4343] flex items-center justify-center">

                <i class="fa-solid fa-xmark text-white text-[62px]"></i>

            </div>

        </div>

        <!-- Heading -->

        <h1 class="oswald-medium text-center text-[47px] text-[#111111] mt-[24px]">

            Error!

        </h1>

        <!-- Description -->

        <p class="poppins-regular text-center text-[16px] text-[#6C6C6C] mt-[12px]">

            Opps, Something went wrong!

        </p>

        <!-- Button -->

        <a href="./auth.html"
            class="mt-[48px] w-full h-[56px] rounded-[8px] bg-[#CB4343] flex items-center justify-center poppins-medium text-white text-[20px] hover:opacity-90 transition">

            Try Again

        </a>

    </div>

</body>

</html>
